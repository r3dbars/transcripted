# Disposable diagnostic only. Never merge this branch.
name: Native capture scroll diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spm-tests:
    runs-on: [self-hosted, macOS, ARM64, transcripted-integration-2530-fdb]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdb0236ae0da9df0204c80d044e290fd489b9690
          persist-credentials: false
      - name: Verify isolation and run focused native scroll smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-proof
          stage=preflight
          finish() {
            code=$?
            trap - EXIT
            printf 'source=%s\nworkflow_sha=%s\nrun_id=%s\njob=%s\nstage=%s\nexit=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$stage" "$code" > diagnostic-proof/receipt.txt
            for log in diagnostic-proof/*.raw; do
              [ -f "$log" ] || continue
              tail -c 524288 "$log" > "${log%.raw}.log"
              rm "$log"
            done
            exit "$code"
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = fdb0236ae0da9df0204c80d044e290fd489b9690
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = r3dbars/transcripted
          test "$GITHUB_JOB" = spm-tests
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$CI" = true
          test "$GITHUB_ACTIONS" = true
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(cat /var/run/transcripted-ci-firewall.ok)" = "$(sysctl -n kern.bootsessionuuid)"
          python3 scripts/ops/native-smoke-isolation.py
          python3 - <<'PYVERIFY'
          import os, pwd, subprocess
          import runpy
          guard = runpy.run_path('scripts/ops/native-smoke-isolation.py')
          assert guard['in_throwaway_ci_vm']()
          assert guard['root_only']('/var/run/transcripted-ci-firewall.ok')
          assert os.getuid() == os.stat('/dev/console').st_uid
          groups = subprocess.check_output(['id', '-Gn'], text=True).split()
          assert 'admin' not in groups
          assert subprocess.run(['sudo', '-n', '-k', 'true'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0
          print('isolation=throwaway-vm; desktop=dedicated; admin=false; arch=arm64; os=26')
          PYVERIFY
          stage=build-deps
          bash build-deps.sh > diagnostic-proof/build-deps.raw 2>&1
          stage=native-scroll
          bash scripts/dev/test-capture-list-load-more-scroll.sh > diagnostic-proof/native-scroll.raw 2>&1
          stage=complete
      - name: Preserve bounded logs and exact-source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scroll-fdb-${{ github.run_id }}
          path: diagnostic-proof/
          if-no-files-found: error
          retention-days: 14
