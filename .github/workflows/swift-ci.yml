# Disposable diagnostic only. Never merge this branch.
name: Full candidate validation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spm-tests:
    runs-on: [self-hosted, macOS, ARM64, transcripted-e66-proof-1111]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: candidate
    env:
      TRANSCRIPTED_DISABLE_FILE_LOGGER: "1"
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e66e3e4fb7c4e73e5a6825a8f66458425ca12d16
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: diagnostic-harness
      - uses: actions/checkout@v4
        with:
          ref: 8a38235eef00816a79daa1324387a21ef880204d
          fetch-depth: 0
          persist-credentials: false
          path: reviewed-harness
      - name: Verify isolation and run full validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-proof
          stage=preflight
          finish() {
            code=$?
            trap - EXIT
            printf 'source=%s\nworkflow_sha=%s\nrun_id=%s\njob=%s\nstage=%s\nexit=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$stage" "$code" > diagnostic-proof/receipt.txt
            for log in diagnostic-proof/*.raw; do
              [ -f "$log" ] || continue
              python3 ../diagnostic-harness/.github/diagnostics/bound-log.py "$log" > "${log%.raw}.log"
              mkdir -p "$RUNNER_TEMP/private-diagnostic-logs"
              mv "$log" "$RUNNER_TEMP/private-diagnostic-logs/"
            done
            exit "$code"
          }
          trap finish EXIT
          test "$(git rev-parse HEAD)" = e66e3e4fb7c4e73e5a6825a8f66458425ca12d16
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = r3dbars/transcripted
          test "$GITHUB_JOB" = spm-tests
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$CI" = true
          test "$GITHUB_ACTIONS" = true
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(cat /var/run/transcripted-ci-firewall.ok)" = "$(sysctl -n kern.bootsessionuuid)"
          python3 scripts/ops/native-smoke-isolation.py
          python3 - <<'PYVERIFY'
          import os, stat, subprocess
          import runpy
          guard = runpy.run_path('scripts/ops/native-smoke-isolation.py')
          assert guard['in_throwaway_ci_vm']()
          # The stamp lives under macOS /var/run; validate the file itself.
          # root_only is for protected /Library chains, not /var/run ancestors.
          stamp = os.lstat('/var/run/transcripted-ci-firewall.ok')
          assert stat.S_ISREG(stamp.st_mode) and stamp.st_uid == 0
          assert stamp.st_mode & 0o022 == 0
          assert guard['root_only']('/Library/TranscriptedCI/firewall.sh')
          assert os.getuid() == os.stat('/dev/console').st_uid
          groups = subprocess.check_output(['id', '-Gn'], text=True).split()
          assert 'admin' not in groups
          assert subprocess.run(['sudo', '-n', '-k', 'true'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0
          print('isolation=throwaway-vm; desktop=dedicated; admin=false; arch=arm64; os=26')
          PYVERIFY
          stage=full-validation
          bash ../diagnostic-harness/.github/diagnostics/run-full.sh
          stage=complete
      - name: Preserve bounded logs and exact-source receipt
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-proof-e66-${{ github.run_id }}
          path: |
            candidate/diagnostic-proof/receipt.txt
            candidate/diagnostic-proof/stages.tsv
            candidate/diagnostic-proof/coverage.json
            candidate/diagnostic-proof/fixture-receipt.json
            candidate/diagnostic-proof/concurrency.json
            candidate/diagnostic-proof/toolchain.txt
            candidate/diagnostic-proof/locale.json
          if-no-files-found: error
          retention-days: 14
