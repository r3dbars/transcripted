name: Swift CI

# Builds the app and runs the full curated suite — fast tests, Core package
# tests, integration smoke, E2E smoke, and the Tools package tests — on every
# PR and on merges to main. This is the machine enforcement behind the local
# verification contract in .agents/test-matrix.yml.
#
# The suite used to run as ONE sequential macOS job, so every check waited
# behind the ~15-25 min app build and one failing step blocked signal on all
# steps after it. It is now split by its real dependency graph so the
# build-independent checks run in parallel with the single expensive app build:
#
#   checks      — build-independent (no prebuilt deps, no app bundle): source-list
#                 contracts, fast tests, E2E smoke.
#   spm-tests   — Core package tests (`swift test`) + integration smoke, which
#                 need the prebuilt native deps but NOT the app bundle, plus the
#                 Tools package tests (build-independent, parked here to balance
#                 wall-clock against `checks`). Restores the shared deps cache and
#                 runs in parallel with the app build.
#   app-build   — the only job that runs the full app build: build the native
#                 deps (populating the shared cache), build the app bundle, then
#                 the app-dependent Premium performance budget.
#   build-and-test — required-status umbrella (see below). Aggregates the three
#                 parallel jobs; fails if any of them failed.
#
# Why the umbrella: branch protection requires the status context
# "build-and-test". Keeping a job with that exact id means splitting the work
# across new jobs does not orphan the required check. The umbrella uses
# `if: always()` so a failed upstream job fails it (rather than skipping it),
# and it explicitly asserts every upstream job succeeded. If you rename the
# jobs, keep the umbrella's id as `build-and-test` or update branch protection's
# required contexts to match.
#
# All jobs run on macOS 26 because the compiled sources pull in macOS-only SDKs
# (AppKit, ScreenCaptureKit, FoundationModels, etc.) and the app targets
# arm64-apple-macos26.0, so the runner must carry a toolchain/SDK that can
# target macOS 26.
#
# `checks` and `spm-tests` prefer the owner's Mac (a self-hosted runner labelled
# transcripted-mac, in a fresh throwaway macOS VM per job) whenever it
# reported free in the last 60s and has no job already queued or running, and
# use hosted macos-26 otherwise. GitHub gives this account only 5 concurrent
# hosted macOS jobs, so moving two of each PR's three jobs off hosted lets more
# PRs run at once. `pick-runner` makes the choice (scripts/ci/pick-ci-runner.py);
# fork PRs always stay hosted, and the Mac's job-started hook refuses them too.
# `app-build` always stays hosted: its launch smoke is kept to hosted runners
# (scripts/ops/native-smoke-isolation.py). Setup, pause, and removal:
# docs/self-hosted-mac-runner.md.
#
# None of these jobs use continue-on-error, so a failure blocks merge instead of
# leaving merge safety to local discipline alone.

on:
  pull_request:
  # The merge queue re-runs CI on the PR merged with the latest main. Those runs
  # go to hosted runners: pick-ci-runner.py and the Mac's job hook only route
  # push, workflow_dispatch and same-repo pull_request to the Mac.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_bench_source_sha:
        description: Run only the hosted full QA bench against this trusted full commit SHA; leave empty for normal Swift CI
        type: string
        required: false
        default: ""
      staged_update_source_sha:
        description: Run only the staged signed 1.1.68-to-1.1.69 updater proof against its verified full promotion SHA
        type: string
        required: false
        default: ""
      run_hardware_smokes:
        description: >-
          Run the real mic / system-audio smokes on a self-hosted Apple Silicon
          runner labelled [self-hosted, macOS, ARM64]. Requires Microphone and
          System Audio Recording TCC grants for the runner agent. Leave false to
          only print the manual commands.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# PRs: a new push cancels the older run on that branch; only the newest head
# matters. main: a run that has started always finishes, so main's history
# shows a real pass or fail instead of a trail of cancelled runs. GitHub still
# collapses a burst of merges: while one main run is going, only the newest
# waiting run is kept, and it tests all of those commits together. (A group
# per commit would let main runs pile up in parallel and take the hosted macOS
# slots PRs need.)
concurrency:
  # Staged updates serialize together without waiting behind the full bench.
  group: swift-ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.staged_update_source_sha != '' && '-staged-update' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every build/test entrypoint disables the on-disk file logger so it does not
  # write into the runner's home. This mirrors the per-step env that the old
  # single-job workflow set on every step.
  TRANSCRIPTED_DISABLE_FILE_LOGGER: "1"

jobs:
  # Picks the runner for `checks` and `spm-tests`: the owner's Mac when its
  # heartbeat says it is free and nothing is waiting for it, hosted macos-26
  # otherwise. Linux, so it never takes one of the 5 hosted macOS slots.
  # actions: read lets it count jobs already queued for the Mac. Runs stuck
  # behind a Mac that went quiet are re-run by mac-runner-sweep.yml, from main.
  pick-runner:
    if: github.event_name != 'workflow_dispatch' || (inputs.full_bench_source_sha == '' && inputs.staged_update_source_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci

      - name: Pick the owner's Mac or a hosted runner
        id: pick
        shell: bash
        env:
          HEARTBEAT: ${{ vars.MAC_RUNNER_HEARTBEAT }}
          MODE: ${{ vars.MAC_RUNNER_MODE }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pick-ci-runner.py

  # ---------------------------------------------------------------------------
  # Fast feedback: build-independent checks that compile against the system SDK
  # only and need NEITHER the prebuilt native deps NOR the full app build. Runs
  # fully in parallel with the expensive app build, so a broken fast test
  # surfaces in minutes instead of behind the app build.
  #
  # Build-independence is load-bearing here:
  #   - run-tests.sh compiles a curated Sources/Tests list against system
  #     frameworks (no deps-*/app link).
  #   - run-e2e-smoke.sh compiles a curated source list + TranscriptedCaptureKit
  #     from source against system frameworks (no deps-*/app link).
  # The Tools package tests are also build-independent but live in spm-tests to
  # balance wall-clock (fast tests + Tools tests were the two heaviest chunks and
  # stacking them here made this job the critical path). If either of the above
  # grows a dependency on the prebuilt deps, move it to spm-tests (which already
  # has the deps cache/build steps).
  # ---------------------------------------------------------------------------
  checks:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build source-list contracts
        shell: bash
        run: python3 scripts/dev/check-build-source-lists.py

      - name: Dependency archive input guards
        shell: bash
        run: bash Tests/BuildDependencies/ArchiveInputsTests.sh

      - name: CLI manifest mode guards
        shell: bash
        run: bash Tests/BuildDependencies/CLIManifestTests.sh

      - name: CLI packaging capability guards
        shell: bash
        run: bash Tests/BuildDependencies/CLIPackagingTests.sh

      - name: Fast tests
        shell: bash
        env:
          # Several dictation-writer tests construct fixed -0500 instants and
          # assert locally-formatted headings/filenames; match the supported
          # interactive environment instead of the runner's UTC default.
          TZ: America/Chicago
          # Wall-clock timing proofs (clipboard restore windows) are not
          # provable under shared-runner scheduler jitter; they still run on
          # every local bash run-tests.sh.
          TRANSCRIPTED_SKIP_TIMING_SENSITIVE_TESTS: "1"
        run: bash run-tests.sh

      - name: E2E smoke
        shell: bash
        run: bash run-e2e-smoke.sh

  # ---------------------------------------------------------------------------
  # SPM package tests that need the prebuilt native deps (libExternalDeps.a for
  # `swift test`, libDraftDeps.a for the integration smoke, plus deps-modules)
  # but NOT the built app bundle. Restores the shared deps cache and, on a miss,
  # self-heals by building deps here — so it never has to wait behind the app
  # build. On hosted runners app-build is the canonical cache saver and this job
  # restores only. The owner's Mac (a fresh VM per job) never runs app-build,
  # so it may restore hosted entries but only ever saves its own `deps-mac-`
  # entries, and only from main so PR runs don't crowd the repo's cache.
  # ---------------------------------------------------------------------------
  spm-tests:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fingerprint Swift toolchain
        id: swift-toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(swiftc --version | shasum -a 256 | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt dependencies
        id: deps-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-libs
            deps-modules
            deps-frameworks
            deps-tools
          key: deps-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/entrypoints/build-deps.sh', 'Package.swift', 'Sources/TranscriptedCore/**') }}
          # Fall back only within the active Swift toolchain. Swift modules are
          # compiler-version-specific and cannot safely warm-start across upgrades.
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-

      - name: Restore prebuilt dependencies (owner's Mac)
        id: deps-cache-mac
        if: runner.environment == 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-libs
            deps-modules
            deps-frameworks
            deps-tools
          key: deps-mac-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/entrypoints/build-deps.sh', 'Package.swift', 'Sources/TranscriptedCore/**') }}
          # Same toolchain only, as above. The exact hosted key is safe to read
          # (hosted never reads deps-mac- entries).
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/entrypoints/build-deps.sh', 'Package.swift', 'Sources/TranscriptedCore/**') }}
            deps-mac-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-

      - name: Build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.deps-cache.outputs.cache-hit }}" = "true" ] || [ "${{ steps.deps-cache-mac.outputs.cache-hit }}" = "true" ]; then
            # The cache key already hashes every staleness input, so a hit means
            # the artifacts match this tree. Refresh the mtime stamp so
            # build-deps.sh's mtime check agrees with the fresh checkout.
            touch deps-libs/.build-deps-stamp
          fi
          bash build-deps.sh

      - name: Save prebuilt dependencies (owner's Mac, main only)
        if: runner.environment == 'self-hosted' && github.event_name == 'push' && steps.deps-cache-mac.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps-libs
            deps-modules
            deps-frameworks
            deps-tools
          key: ${{ steps.deps-cache-mac.outputs.cache-primary-key }}

      # XCTest's stall detector has aborted this step several times, always at
      # a main-thread wait, with no stack to say what was stuck. The same
      # freeze also hides in passing runs as one ~150s test. The watcher
      # samples xctest when its output goes quiet; the step below prints those
      # samples and any xctest crash report, pass or fail.
      - name: Core package tests
        shell: bash
        run: bash scripts/dev/swift-test-stall-watch.sh swift test

      - name: Print xctest stall diagnostics
        if: always()
        shell: bash
        run: python3 scripts/dev/print-stall-diagnostics.py "$RUNNER_TEMP/xctest-stall-samples"

      - name: Integration smoke
        shell: bash
        run: bash run-integration-smoke.sh

      # The Tools packages each resolve their own remote SwiftPM dependencies.
      # Cache the shared clone/checkout store so every push and PR doesn't
      # re-fetch them from the network. Keyed on the resolved pins, so a
      # dependency bump invalidates it; the prefix fallback still warm-starts
      # a partially-changed set within the same toolchain.
      - name: Cache SwiftPM dependencies for Tools packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-tools-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('Tools/*/Package.resolved', 'Tools/*/Package.swift') }}
          restore-keys: |
            swiftpm-tools-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-

      # Build-independent (no prebuilt deps): the five Tools packages compile
      # with no TRANSCRIPTEDCLI_ENABLE_* set, so they never link the deps. They
      # live here (not in `checks`) purely to balance wall-clock — see the
      # comment on the `checks` job.
      - name: Tools package tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Tools/TranscriptedCaptureKit
          swift test --package-path Tools/TranscriptedCLI
          swift test --package-path Tools/TranscriptedMCP
          swift test --package-path Tools/TranscriptedQA
          swift test --package-path Tools/TranscriptedLive

      # These modes import the prebuilt audio/Core modules. The real-model
      # executable tests remain opt-in (no audio/model downloads on hosted CI).
      - name: CLI build-mode transitions
        shell: bash
        run: |
          set -euo pipefail
          TRANSCRIPTEDCLI_EXPECT_BUILD_MODE=audio TRANSCRIPTEDCLI_ENABLE_TRANSCRIPTION=1 swift test --package-path Tools/TranscriptedCLI
          TRANSCRIPTEDCLI_EXPECT_BUILD_MODE=meeting TRANSCRIPTEDCLI_ENABLE_MEETING_IMPORT=1 swift test --package-path Tools/TranscriptedCLI
          TRANSCRIPTEDCLI_EXPECT_BUILD_MODE=retrieval swift test --package-path Tools/TranscriptedCLI

  # ---------------------------------------------------------------------------
  # The expensive path: build the native deps (populating the shared deps cache
  # for spm-tests to reuse on later runs), build the app bundle, then run the
  # app-dependent Premium performance budget. This is the ONLY job that runs the
  # full ~15-25 min app build.
  # ---------------------------------------------------------------------------
  app-build:
    runs-on: macos-26
    if: github.event_name != 'workflow_dispatch' || (inputs.full_bench_source_sha == '' && inputs.staged_update_source_sha == '')
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fingerprint Swift toolchain
        id: swift-toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(swiftc --version | shasum -a 256 | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache prebuilt dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps-libs
            deps-modules
            deps-frameworks
            deps-tools
          key: deps-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/entrypoints/build-deps.sh', 'Package.swift', 'Sources/TranscriptedCore/**') }}
          # Fall back only within the active Swift toolchain. Swift modules are
          # compiler-version-specific and cannot safely warm-start across upgrades.
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.swift-toolchain.outputs.fingerprint }}-

      - name: Build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.deps-cache.outputs.cache-hit }}" = "true" ]; then
            # The cache key already hashes every staleness input, so a hit means
            # the artifacts match this tree. Refresh the mtime stamp so
            # build-deps.sh's mtime check agrees with the fresh checkout.
            touch deps-libs/.build-deps-stamp
          fi
          bash build-deps.sh

      - name: Build app
        shell: bash
        # GitHub-hosted macOS runners boot a real GUI/WindowServer session (the
        # same reason XCUITest works there), so build.sh runs its launch smoke
        # here instead of skipping it.
        run: bash build.sh --no-open

      - name: Premium performance budget
        shell: bash
        # The app-build step above runs build.sh, whose launch smoke writes
        # build/launch-ui-smoke.json with launchToInteractiveMs. Score it here so
        # a launch-to-interactive regression fails CI (PRD WS4.2). The real UX
        # number is the warm Apple-Silicon product target (<400ms, measured
        # ~285ms). This CI gate is a COARSE catastrophic-regression guard only:
        # the GitHub runner's single cold-launch sample is very noisy (observed
        # 1420ms and 2095ms on identical commits, ~48% swing), so 3000ms is set
        # to never flake while still failing on a gross blow-up (e.g. a
        # synchronous model/network load added to the launch path). A future
        # tightening is min-of-N sampling in the smoke to sharpen the signal.
        run: scripts/ops/performance-budget.rb --check-home-recent-captures --allow-missing-parakeet-model --max-app-mb 220 --max-resources-mb 80 --launch-ui-smoke build/launch-ui-smoke.json --max-launch-interactive-ms 3000

  # ---------------------------------------------------------------------------
  # Required-status umbrella. Branch protection requires the "build-and-test"
  # context; keeping a job with that exact id means the split above does not
  # orphan the required check. `if: always()` makes this job run even when an
  # upstream job fails (a skipped required check would leave the PR unmergeable),
  # and the step asserts every upstream job actually succeeded.
  # ---------------------------------------------------------------------------
  build-and-test:
    needs: [pick-runner, checks, spm-tests, app-build]
    if: always() && (github.event_name != 'workflow_dispatch' || (inputs.full_bench_source_sha == '' && inputs.staged_update_source_sha == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all Swift CI jobs to succeed
        shell: bash
        env:
          PICKED_RUNNER: ${{ needs.pick-runner.outputs.runs-on }}
        run: |
          set -euo pipefail
          pick_result='${{ needs.pick-runner.result }}'
          checks_result='${{ needs.checks.result }}'
          spm_result='${{ needs.spm-tests.result }}'
          app_result='${{ needs.app-build.result }}'
          echo "pick-runner=$pick_result checks=$checks_result spm-tests=$spm_result app-build=$app_result"
          echo "checks + spm-tests ran on: ${PICKED_RUNNER:-unknown}"
          for result in "$pick_result" "$checks_result" "$spm_result" "$app_result"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required Swift CI job did not succeed (pick-runner=$pick_result, checks=$checks_result, spm-tests=$spm_result, app-build=$app_result)."
              exit 1
            fi
          done
          echo "All Swift CI jobs succeeded."

  # Hardware-dependent smokes. These need a physical microphone, a System Audio
  # Recording TCC grant, and real paste-back focus, which GitHub-hosted runners
  # cannot provide. They run on a self-hosted Apple Silicon runner or as a
  # release checklist item — never as part of pull_request, so they can never
  # block a normal PR.
  #
  # Both jobs below are workflow_dispatch-only and mutually exclusive on the
  # `run_hardware_smokes` input: true runs the real smokes on a self-hosted
  # runner, false prints the manual commands. Neither can block a PR.
  hardware-smokes:
    if: github.event_name == 'workflow_dispatch' && inputs.full_bench_source_sha == '' && inputs.staged_update_source_sha == '' && inputs.run_hardware_smokes
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dependencies
        run: bash build-deps.sh

      - name: Live capture smoke
        run: bash run-live-capture-smoke.sh

      - name: Slow paste-back smoke
        run: bash run-slow-pasteback-smoke.sh

  # Fallback for when no self-hosted runner is registered yet: prints the exact
  # commands an operator should run by hand on an Apple Silicon Mac. Flip
  # `run_hardware_smokes` to true once a runner exists and `hardware-smokes`
  # above replaces this with a real gate.
  hardware-smokes-manual-instructions:
    if: github.event_name == 'workflow_dispatch' && inputs.full_bench_source_sha == '' && inputs.staged_update_source_sha == '' && !inputs.run_hardware_smokes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Document manual hardware smokes
        shell: bash
        run: |
          set -euo pipefail
          echo "Hardware-dependent smokes require a physical mic + System Audio"
          echo "Recording TCC grant + paste-back focus on an Apple Silicon Mac."
          echo "Run these manually on such a machine (or a self-hosted runner):"
          echo "  bash run-live-capture-smoke.sh"
          echo "  bash run-slow-pasteback-smoke.sh"
          echo "They are intentionally excluded from the PR gate."
          echo
          echo "To automate: register a self-hosted runner labelled"
          echo "  [self-hosted, macOS, ARM64]"
          echo "grant its agent Microphone + System Audio Recording in System"
          echo "Settings > Privacy & Security, then re-dispatch this workflow"
          echo "with run_hardware_smokes = true."

  # A separate dispatch mode for the literal release-impacting QA contract.
  # Uses an immutable source SHA and never routes work to the owner's runner.
  # This rebuilds a developer app; signed-artifact and human proof stay separate.
  full-qa-bench:
    if: github.event_name == 'workflow_dispatch' && inputs.full_bench_source_sha != '' && inputs.staged_update_source_sha == '' && !inputs.run_hardware_smokes
    runs-on: macos-26
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.full_bench_source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      TZ: America/Chicago

    steps:
      - name: Validate immutable source and hosted runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Full bench requires a full lowercase commit SHA.'; exit 1; }
          [[ "$RUNNER_ENVIRONMENT" = github-hosted && "$(uname -m)" = arm64 ]] || { echo '::error::Full bench requires hosted Apple Silicon.'; exit 1; }

      - name: Checkout reviewed validation harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: validation-harness
          persist-credentials: false

      - name: Checkout exact bench source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.full_bench_source_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Verify checkout identities and toolchain
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C ../validation-harness rev-parse HEAD)" = "$WORKFLOW_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/ops/native-smoke-isolation.py
          swiftc --version
          xcodebuild -version

      - name: Check fixture setup failure guards
        run: python3 validation-harness/Tests/BuildDependencies/HostedQAArtifactsTests.py

      - name: Build full bench dependencies
        working-directory: candidate
        run: bash build-deps.sh

      - name: Reproduce missing artifacts and seed synthetic default layout
        run: python3 validation-harness/scripts/ci/prepare-hosted-qa-artifacts.py --candidate-root candidate

      - name: Run literal full QA bench
        id: full-bench
        working-directory: candidate
        shell: bash
        # Do not skip builds, launch smokes, or timing-sensitive tests. Failures
        # remain failures; this job does not retry until green.
        run: |
          set +e
          bash scripts/ops/transcripted-qa-bench.sh --mode full --out-root "$RUNNER_TEMP/full-qa-bench" --run-id hosted
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Write bounded bench receipt
        if: always()
        shell: bash
        env:
          BENCH_EXIT: ${{ steps.full-bench.outputs.exit_code }}
          BENCH_OUTCOME: ${{ steps.full-bench.outcome }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import csv, importlib.util, json, os, pathlib, re
          spec = importlib.util.spec_from_file_location("qa_setup", "validation-harness/scripts/ci/prepare-hosted-qa-artifacts.py")
          qa_setup = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(qa_setup)
          expected = {
              '00-preflight', '01-build', '02-fast-tests', '03-e2e-smoke',
              '04-slow-pasteback-smoke', '10-integration-smoke', '11-core-swift-test',
              '12-qa-cli-tests', '13-qa-round-trip', '14-qa-stress-small',
              '15-imported-audio-smoke', '21-qa-validate-all', '30-audio-synthetic',
              '60-release-health', '62-posthog-product-tasks',
          }
          source = os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise SystemExit('Invalid source SHA; no receipt created.')
          rows, seen = [], set()
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'full-qa-bench/hosted/results.tsv'
          try:
              lines = results.read_text().splitlines() if results.exists() else []
          except (OSError, UnicodeError):
              raise SystemExit('Bench results could not be read safely.')
          for row in csv.reader(lines, delimiter='\t'):
              if len(row) != 6 or row[0] not in expected or row[0] in seen or row[2] not in {'PASS', 'FAIL', 'WARN', 'SKIP'}:
                  raise SystemExit('Unexpected bench result shape; refusing to publish raw data.')
              if not all(re.fullmatch('[0-9]{1,9}', row[index]) for index in (3, 4)):
                  raise SystemExit('Invalid numeric bench result; refusing to publish raw data.')
              seen.add(row[0])
              rows.append({'step': row[0], 'status': row[2], 'exit_code': int(row[3]), 'seconds': int(row[4])})
          exit_code = os.environ.get('BENCH_EXIT', '')
          if exit_code and not re.fullmatch('[0-9]{1,3}', exit_code):
              raise SystemExit('Invalid bench exit code.')
          receipt = {
              'source_sha': source, 'workflow_sha': os.environ['WORKFLOW_SHA'],
              'bench_exit_code': int(exit_code) if exit_code else None,
              'bench_outcome': os.environ['BENCH_OUTCOME'],
              'all_expected_steps_recorded': seen == expected, 'steps': rows,
              'proof': 'Literal full bench on a rebuilt developer app; release-health uses committed fixtures.',
              'remaining_proof': ['signed release artifact', 'real meeting apps and Bluetooth', 'pasteback feel', 'installed upgrade', 'live Sentry'],
              'release_verdict': 'HOLD: separate release and human gates still apply',
          }
          validation_log = results.parent / 'logs/21-qa-validate-all.log'
          if validation_log.exists():
              try:
                  receipt['artifact_validation'] = qa_setup.bounded_report(validation_log.read_text())
              except (qa_setup.UnsafeEvidence, OSError, UnicodeError):
                  raise SystemExit('Artifact validation diagnostics could not be bounded safely.')
          receipt['artifact_data'] = 'Synthetic default artifact setup is required; see qa-artifact-setup-receipt.json complete field'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'full-qa-bench-receipt.json'
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          if seen != expected:
              raise SystemExit('Full bench evidence is incomplete.')
          PY

      - name: Upload bounded bench receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-qa-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/full-qa-bench-receipt.json
            ${{ runner.temp }}/qa-artifact-setup-receipt.json
          if-no-files-found: error
          retention-days: 7
          # Raw logs, generated captures, app bundles, and private artifact
          # validation output are deliberately not uploaded.

  reject-conflicting-validation-modes:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((inputs.full_bench_source_sha != '' && inputs.staged_update_source_sha != '') ||
       (inputs.run_hardware_smokes && (inputs.full_bench_source_sha != '' || inputs.staged_update_source_sha != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require one validation mode
        run: |
          echo '::error::Choose exactly one hosted validation mode, with run_hardware_smokes=false.'
          exit 1

  # Exercise the signed 1.1.68 -> 1.1.69 updater against a local staging feed.
  # Harness code is pinned to this workflow, independently of the candidate.
  staged-update-proof:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.staged_update_source_sha != '' &&
      inputs.full_bench_source_sha == '' && !inputs.run_hardware_smokes
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.staged_update_source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Validate fixed candidate and hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = e42ad0f759612e0080f2d11bb5de12fda6b590bd || { echo '::error::This updater proof is scoped to the verified 1.1.69 promotion SHA.'; exit 1; }
          [[ "$RUNNER_ENVIRONMENT" = github-hosted && "$(uname -m)" = arm64 ]] || { echo '::error::Updater proof requires hosted Apple Silicon.'; exit 1; }

      - name: Checkout reviewed updater harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout exact updater candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.staged_update_source_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify both checkout identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          python3 candidate/scripts/ops/native-smoke-isolation.py

      - name: Verify harness failure guards
        shell: bash
        run: python3 harness/Tests/BuildDependencies/StagedSparkleUpdateTests.py

      - name: Exercise signed full and delta updates
        shell: bash
        run: python3 harness/scripts/release/test-staged-sparkle-update.py --candidate-root candidate --output "$RUNNER_TEMP/staged-update-proof"

      - name: Upload bounded updater receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-update-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-update-proof/receipt.json
          if-no-files-found: error
          retention-days: 7
          # Do not upload downloaded apps, staging feeds, raw logs, or captures.
