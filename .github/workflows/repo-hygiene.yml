name: Repo Hygiene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Every Linux-runnable check in one place (see scripts/README.md). Some
      # overlap with the inline steps below is intentional.
      - name: Linux checks (scripts/dev/linux-checks.sh)
        shell: bash
        run: bash scripts/dev/linux-checks.sh --strict-tools

      - name: Agent preflight
        shell: bash
        run: bash scripts/dev/agent-preflight.sh origin/main

      - name: Test matrix selector
        shell: bash
        run: python3 scripts/dev/test-matrix-checks.py --self-test

      - name: Agent contract
        shell: bash
        run: python3 scripts/dev/agent-context.py --self-test

      - name: Agent proof runner
        shell: bash
        run: python3 scripts/dev/agent-check.py --self-test

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-deps.sh
          bash -n build-beta.sh
          bash -n build.sh
          bash -n run-tests.sh
          bash -n run-integration-smoke.sh
          bash -n run-e2e-smoke.sh
          bash -n run-live-capture-smoke.sh
          bash -n run-daily-audio-reliability.sh
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # The clean test VM script deletes host folders (share dirs, purge), so
      # its name and TVM_HOME guards are checked on every PR. No Tart needed.
      - name: Clean VM script guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vm/vnc.py --self-test
          bash scripts/vm/test-transcripted-vm.sh

      # Swift CI's runner choice and the owner's Mac runner guards (fork PRs
      # never reach the Mac) are plain bash, so their decisions are checked
      # here on every PR.
      - name: Mac runner routing guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pick-ci-runner.py --self-test
          bash scripts/ci/mac-runner.sh self-test

      # The release pipeline's Sparkle appcast merge (delta update URLs, the
      # upload manifest, failure before docs/appcast.xml is written) runs
      # against a stub generate_appcast, so it needs no Mac or signing key.
      - name: Sparkle appcast delta guards
        shell: bash
        run: bash Tests/BuildDependencies/SparkleAppcastDeltaTests.sh

      - name: Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

      - name: Appcast critical-update marker
        shell: bash
        run: python3 scripts/release/mark-appcast-critical.py --self-test

      # Catches same-scope duplicate declarations (e.g. a symbol declared twice
      # by a bad git auto-merge) in seconds, so they fail here instead of 20
      # minutes into the macOS Swift build. --self-test guards the checker's own
      # precision (overloads, protocol reqs, switch arms, if/guard-let chains).
      - name: Duplicate declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dev/check-duplicate-declarations.py --self-test
          python3 scripts/dev/check-duplicate-declarations.py

