name: Repo Hygiene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `repo-hygiene` is a required status check; keep it unchanged.
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Every Linux-runnable check lives in scripts/dev/linux-checks.sh so agents
      # without Swift run exactly what this job runs. It covers the checks this
      # job used to inline (agent preflight vs origin/main, test-matrix and
      # agent-contract/proof-runner self-tests, bash -n on root and scripts/**
      # shell scripts, the clean-VM script guards, ruby -c, py_compile, and the
      # duplicate-declaration checker + its self-test) plus build-source lists,
      # analytics/telemetry/privacy gates, the Swift source-pin mirror, every
      # scripts/ops + scripts/release --self-test, script test suites, and the
      # deterministic fixture lanes from .agents/test-matrix.yml.
      # --strict-tools turns a missing ruby or origin/main into a failure
      # instead of a local-friendly SKIP. Each output line carries its command,
      # so a failure can be re-run by copy-paste.
      - name: Linux checks
        shell: bash
        run: bash scripts/dev/linux-checks.sh --strict-tools
