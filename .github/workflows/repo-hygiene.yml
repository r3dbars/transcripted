name: Repo Hygiene

on:
  pull_request:
  # Run for GitHub merge-queue merge groups so this required gate executes
  # against the queue's temporary merged ref before landing. Without this
  # trigger the queue would wait forever for a "repo-hygiene" check that
  # never starts. See .github/merge-queue.md.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Agent preflight
        shell: bash
        run: bash scripts/dev/agent-preflight.sh origin/main

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-deps.sh
          bash -n build-beta.sh
          bash -n build.sh
          bash -n run-tests.sh
          bash -n run-integration-smoke.sh
          bash -n run-e2e-smoke.sh
          bash -n run-live-capture-smoke.sh
          bash -n run-daily-audio-reliability.sh
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile
