    <stop offset="0" stop-color="#ffdca0"/><stop offset="0.5" stop-color="#ff9a45"/><stop offset="1" stop-color="#ff5a2a"/></linearGradient>
  <clipPath id="tile"><path d="M 628.000 100.000 c 103.610 0 155.415 0 194.988 20.164 a 185 185 0 0 1 80.848 80.848 c 20.164 39.574 20.164 91.379 20.164 194.988 L 924.000 628.000 c 0 103.610 0 155.415 -20.164 194.988 a 185 185 0 0 1 -80.848 80.848 c -39.574 20.164 -91.379 20.164 -194.988 20.164 L 396.000 924.000 c -103.610 0 -155.415 0 -194.988 -20.164 a 185 185 0 0 1 -80.848 -80.848 c -20.164 -39.574 -20.164 -91.379 -20.164 -194.988 L 100.000 396.000 c 0 -103.610 0 -155.415 20.164 -194.988 a 185 185 0 0 1 80.848 -80.848 c 39.574 -20.164 91.379 -20.164 194.988 -20.164 Z"/></clipPath>
