  <radialGradient id="warm" cx="512" cy="520" r="360" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.26"/><stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/></radialGradient>
