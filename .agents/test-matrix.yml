# Path-to-verification map for coding agents.
#
# This file is intentionally simple YAML so humans and agents can read it and
# the dependency-free `scripts/dev/test-matrix-checks.py` selector can execute
# it. `scripts/dev/agent-preflight.sh` delegates here instead of copying rules.

rules:
  - paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
    checks:
      - "bash build.sh --no-open"
      - "bash run-tests.sh"

  - paths:
      - "Sources/Meeting/**"
      - "Sources/TranscriptedCore/**"
      - "Tests/Integration/**"
    checks:
      - "bash build-deps.sh --force"
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "bash run-integration-smoke.sh"

  - paths:
      - "Tests/E2E/**"
      - "run-e2e-smoke.sh"
      - "scripts/entrypoints/run-e2e-smoke.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
    checks:
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash run-e2e-smoke.sh"

  - paths:
      - "Tests/E2E/SlowPastebackSmoke.swift"
      - "Sources/Support/ClipboardRestoringTextPaster.swift"
      - "Sources/Support/TranscriptedConstants.swift"
      - "run-slow-pasteback-smoke.sh"
      - "scripts/entrypoints/run-slow-pasteback-smoke.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
    checks:
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash run-slow-pasteback-smoke.sh"

  - paths:
      - "build-deps.sh"
      - "scripts/entrypoints/build-deps.sh"
      - "scripts/entrypoints/lib/deps-staleness.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n build-deps.sh"
      - "bash -n scripts/entrypoints/build-deps.sh"
      - "bash build-deps.sh --force"

  - paths:
      - "build.sh"
      - "scripts/entrypoints/build.sh"
      - "scripts/entrypoints/lib/swiftc-app-args.sh"
      - "scripts/entrypoints/lib/deps-staleness.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash -n build.sh"
      - "bash -n scripts/entrypoints/build.sh"
      - "bash build.sh --no-open"

  - paths:
      - "run-tests.sh"
      - "scripts/entrypoints/run-tests.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash -n run-tests.sh"
      - "bash -n scripts/entrypoints/run-tests.sh"
      - "bash run-tests.sh"

  - paths:
      - "run-integration-smoke.sh"
      - "scripts/entrypoints/run-integration-smoke.sh"
      - "Tests/Integration/**"
      - "scripts/entrypoints/lib/deps-staleness.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n run-integration-smoke.sh"
      - "bash -n scripts/entrypoints/run-integration-smoke.sh"
      - "bash build-deps.sh --force"
      - "bash run-integration-smoke.sh"

  - paths:
      - "run-daily-audio-reliability.sh"
      - "scripts/ops/daily-audio-reliability-check.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n run-daily-audio-reliability.sh"
      - "bash -n scripts/ops/daily-audio-reliability-check.sh"

  - paths:
      - "scripts/ops/health-probe.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/ops/health-probe.sh"

  - paths:
      - "scripts/ops/posthog-product-dashboard-summary.py"
      - "Tests/Fixtures/posthog-product-dashboard-summary.json"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/posthog-product-dashboard-summary.py"
      - "python3 scripts/ops/posthog-product-dashboard-summary.py --self-test"
      - "python3 scripts/ops/posthog-product-dashboard-summary.py --fixture Tests/Fixtures/posthog-product-dashboard-summary.json --json-only"

  - paths:
      - "scripts/dev/onboarding.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/onboarding.sh"

  - paths:
      - "scripts/dev/check-build-source-lists.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/check-build-source-lists.py"
      - "python3 scripts/dev/check-build-source-lists.py"

  - paths:
      - ".agents/agent-contract.json"
      - "scripts/dev/agent-context.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/agent-context.py"
      - "python3 scripts/dev/agent-context.py --self-test"

  - paths:
      - "scripts/dev/agent-check.py"
      - "scripts/dev/agent-preflight.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/agent-check.py"
      - "python3 scripts/dev/agent-check.py --self-test"

  - paths:
      - ".agents/test-matrix.yml"
      - "scripts/dev/agent-preflight.sh"
      - "scripts/dev/test-matrix-checks.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/test-matrix-checks.py"
      - "python3 scripts/dev/test-matrix-checks.py --self-test"

  - paths:
      - "scripts/dev/check-superseded.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/check-superseded.py"
      - "python3 scripts/dev/check-superseded.py --self-test"

  - paths:
      - "scripts/dev/benchmark-home-recent-captures.sh"
      - "Tests/Benchmarks/HomeRecentCaptureBenchmark.swift"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/benchmark-home-recent-captures.sh"
      - "scripts/dev/benchmark-home-recent-captures.sh --max-average-load-ms 750 --max-cancellation-ms 100"

  - paths:
      - "scripts/ops/generate-nightly-digest.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/generate-nightly-digest.py"
      - "python3 scripts/ops/generate-nightly-digest.py --self-test"

  - paths:
      - "scripts/ops/posthog-product-context-pack.py"
      - "Tests/Fixtures/posthog-product-context-pack-fixture.json"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/posthog-product-context-pack.py"
      - "python3 scripts/ops/posthog-product-context-pack.py --self-test"
      - "python3 scripts/ops/posthog-product-context-pack.py --fixture Tests/Fixtures/posthog-product-context-pack-fixture.json --write-dir build/posthog-product-context-sample"

  - paths:
      - "scripts/ops/posthog-dashboard-queries.py"
      - "Tests/Fixtures/posthog-dashboard-query-results.json"
      - "Tests/Fixtures/posthog-observed-event-taxonomy.json"
      - "docs/posthog-dashboard-query-helpers.md"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/posthog-dashboard-queries.py"
      - "python3 scripts/ops/posthog-dashboard-queries.py --self-test"
      - "python3 scripts/ops/posthog-dashboard-queries.py --taxonomy-check --observed-fixture Tests/Fixtures/posthog-observed-event-taxonomy.json --json-only"

  - paths:
      - "scripts/ops/nightly-security-check.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/nightly-security-check.py"
      - "python3 scripts/ops/nightly-security-check.py --strict --automation-toml Tests/Fixtures/nightly-security-automation.toml --github-release-json Tests/Fixtures/release-health-github-release-1.1.56.json --write-report build/nightly-security-report.json"

  - paths:
      - "scripts/ops/release-gate-report.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/release-gate-report.py"
      - "python3 scripts/ops/release-gate-report.py --self-test"

  - paths:
      - "scripts/ops/release-health-card.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/release-health-card.py"
      - "python3 scripts/ops/release-health-card.py --self-test"

  - paths:
      - "scripts/ops/check-crash-free-rate.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/check-crash-free-rate.py"
      - "python3 scripts/ops/check-crash-free-rate.py --self-test"

  - paths:
      - "scripts/release/post-dmg-release-audit.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/post-dmg-release-audit.py"
      - "python3 scripts/release/post-dmg-release-audit.py --self-test"

  - paths:
      - "scripts/release/bump-release-version.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/bump-release-version.py"
      - "python3 scripts/release/bump-release-version.py --self-test"
      - "python3 scripts/release/bump-release-version.py --version 1.1.49 --dry-run"

  - paths:
      - "scripts/release/sentry-release-dry-run.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/sentry-release-dry-run.py"
      - "python3 scripts/release/sentry-release-dry-run.py --self-test"

  - paths:
      - "scripts/ops/packaged-app-smoke.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/packaged-app-smoke.py"
      - "python3 scripts/ops/packaged-app-smoke.py --self-test"

  - paths:
      - "scripts/ops/privacy-leak-sweep.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/privacy-leak-sweep.py"
      - "python3 scripts/ops/privacy-leak-sweep.py --write-report build/privacy-leak-sweep-report.json"

  - paths:
      - "scripts/ops/build-codex-memory-index.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/build-codex-memory-index.py"

  - paths:
      - "scripts/ops/nightly-transcripted-archive-miner.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/ops/nightly-transcripted-archive-miner.sh"

  - paths:
      - "scripts/ops/performance-budget.rb"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "ruby -c scripts/ops/performance-budget.rb"

  - paths:
      - "scripts/ops/transcripted-qa-bench.sh"
      - "scripts/ops/validate-meeting-corpus.py"
      - "scripts/ops/compare-meeting-corpus.py"
      - "docs/qa-test-bench.md"
    checks:
      - "bash -n scripts/ops/transcripted-qa-bench.sh"
      - "bash scripts/ops/transcripted-qa-bench.sh --mode quick"
      - "swift test --package-path Tools/TranscriptedQA"
      - "python3 -m py_compile scripts/ops/validate-meeting-corpus.py"
      - "python3 -m py_compile scripts/ops/compare-meeting-corpus.py"

  - paths:
      - "scripts/ops/speaker-naming-simulator.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/speaker-naming-simulator.py"
      - "scripts/ops/speaker-naming-simulator.py"
      - "scripts/ops/speaker-naming-simulator.py --sweep"

  - paths:
      - "scripts/ops/dictation-stop-autoeval.sh"
      - "scripts/ops/dictation-recovery-autoeval.rb"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/ops/dictation-stop-autoeval.sh"
      - "ruby -c scripts/ops/dictation-recovery-autoeval.rb"

  - paths:
      - "scripts/ops/dictation-recovery-autoeval.rb"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "ruby -c scripts/ops/dictation-recovery-autoeval.rb"
      - "ruby scripts/ops/dictation-recovery-autoeval.rb --details"

  - paths:
      - "scripts/ops/agent-todo-runner.rb"
      - "scripts/ops/agent-todo-launchagent.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "ruby -c scripts/ops/agent-todo-runner.rb"
      - "bash -n scripts/ops/agent-todo-launchagent.sh"

  - paths:
      - "Tests/TranscriptedCoreTests/AudioTests/LiveCaptureSmokeTests.swift"
      - "run-live-capture-smoke.sh"
      - "scripts/entrypoints/run-live-capture-smoke.sh"
    checks:
      - "bash run-live-capture-smoke.sh --skip-build"

  - paths:
      - "Package.swift"
      - "Sources/TranscriptedCore/**"
      - "Tests/TranscriptedCoreTests/**"
    checks:
      - "bash build-deps.sh --force"
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "bash run-integration-smoke.sh"
      - "swift test"

  - paths:
      - "Sources/Observability/**"
      - "Info.plist"
      - "docs/sparkle-updates.md"
      - "docs/appcast.xml"
    checks:
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "python3 scripts/dev/check-analytics-emitters.py"

  # An event tracked but never added to the PSV is dropped before delivery and its
  # fleet count is permanently zero, with the paired DiagnosticsTrail record still
  # landing locally so nothing looks wrong. AnalyticsEventPolicyTests only checks
  # the doc and the PSV against each other, never against the emitting code.
  - paths:
      - "Resources/analytics-events.psv"
      - "docs/privacy-first-observability.md"
      - "scripts/dev/check-analytics-emitters.py"
    checks:
      - "python3 scripts/dev/check-analytics-emitters.py"
      - "bash run-tests.sh"

  - paths:
      - "build-beta.sh"
      - "scripts/entrypoints/build-beta.sh"
      - "scripts/release/**"
      - "docs/release-packaging.md"
      - "docs/sparkle-updates.md"
      - "Casks/**"
      - "docs/appcast.xml"
    checks:
      - "bash build-deps.sh --force"
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "SKIP_NOTARIZATION=1 bash build-beta.sh '' <user-name>"

  - paths:
      - "Tools/TranscriptedCaptureKit/**"
    checks:
      - "swift test --package-path Tools/TranscriptedCaptureKit"
      - "swift test --package-path Tools/TranscriptedCLI"
      - "swift test --package-path Tools/TranscriptedMCP"
      - "bash run-e2e-smoke.sh"

  - paths:
      - "Tools/TranscriptedCLI/**"
    checks:
      - "swift test --package-path Tools/TranscriptedCLI"

  - paths:
      - "Tools/TranscriptedMCP/**"
    checks:
      - "swift test --package-path Tools/TranscriptedMCP"
      - "bash run-e2e-smoke.sh"

  - paths:
      - "Tools/TranscriptedQA/**"
    checks:
      - "swift test --package-path Tools/TranscriptedQA"

  - paths:
      - "Tools/SpeakerEvalHarness/**"
      - "scripts/download_ami.sh"
      - "scripts/run_speaker_eval.sh"
      - "scripts/score_speaker_eval.py"
      - "scripts/aggregate_sweep.py"
      - "scripts/run_speaker_autoresearch.py"
      - "scripts/speaker_autoresearch_contract.py"
      - "scripts/speaker_autoresearch_runtime.py"
      - "scripts/test_speaker_autoresearch.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/download_ami.sh"
      - "bash -n scripts/run_speaker_eval.sh"
      - "python3 -m py_compile scripts/score_speaker_eval.py"
      - "python3 -m py_compile scripts/aggregate_sweep.py"
      - "python3 -m py_compile scripts/run_speaker_autoresearch.py"
      - "python3 -m py_compile scripts/speaker_autoresearch_contract.py"
      - "python3 -m py_compile scripts/speaker_autoresearch_runtime.py"
      - "python3 -m py_compile scripts/test_speaker_autoresearch.py"
      - "python3 scripts/test_speaker_autoresearch.py"
      - "bash build-deps.sh --force"
      - "swift build --package-path Tools/SpeakerEvalHarness"
      - "Tools/SpeakerEvalHarness/.build/debug/speaker-eval-harness autoeval-self-test"

  - paths:
      - "README.md"
      - "AGENT_START.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "WORKFLOW.md"
      - "docs/**"
      - "Tests/README.md"
      - "scripts/README.md"
      - "Sources/CLAUDE.md"
      - "Sources/**/CLAUDE.md"
      - "Tools/README.md"
      - "Tools/**/CLAUDE.md"
      - ".agents/**"
      - ".github/**"
      - "scripts/dev/agent-check.py"
      - "scripts/dev/agent-preflight.sh"
      - "scripts/dev/agent-context.py"
      - "scripts/dev/test-matrix-checks.py"
    checks:
      - "scripts/dev/agent-preflight.sh"

  # Root fast tests assert on the literal *content* of these non-Swift files
  # (readSourceFixture / repoFixtureURL / readObservabilityTestRepoTextFile), so
  # editing one can fail run-tests.sh even though no Swift changed. Without this
  # rule preflight reported only itself plus a `bash -n`, and the break surfaced
  # in CI instead of locally. The docs/** members of that same pinned set are
  # deliberately left out — see the docs-only note below and AGENTS.md.
  - paths:
      - ".agents/qa-gates.yml"
      - ".agents/test-matrix.yml"
      - ".github/workflows/swift-ci.yml"
      - "scripts/dev/agent-preflight.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
      - "scripts/entrypoints/run-e2e-smoke.sh"
      - "scripts/ops/daily-audio-reliability-check.sh"
      - "scripts/ops/nightly-security-check.py"
      - "scripts/ops/transcripted-qa-bench.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash run-tests.sh"

notes:
  - "If a change matches multiple rules, run the union of checks."
  - "When in doubt, prefer the stricter AGENTS.md rule."
  - "PR-level overlays still apply: meaningful code needs codex-review against the real PR base; broad or release-impacting work needs bash scripts/ops/transcripted-qa-bench.sh --mode full."
  - "Tiny docs-only PRs intentionally stay on preflight/mapped docs checks unless they change release truth, QA gates, appcast/update flow, Homebrew, or public download truth."
  - "Live capture smoke requires local microphone and System Audio Recording permissions; document permission blockers explicitly."
  - "UI changes should include sanitized review visuals under .agent-review/visuals/."
