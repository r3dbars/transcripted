  # Root fast tests assert on the literal *content* of these non-Swift files
  # (readSourceFixture / repoFixtureURL / readObservabilityTestRepoTextFile), so
  # editing one can fail run-tests.sh even though no Swift changed. Without this
  # rule preflight reported only itself plus a `bash -n`, and the break surfaced
  # in CI instead of locally. The docs/** members of that same pinned set are
  # deliberately left out — see the docs-only note below and AGENTS.md. The menu
  # bar glyph generator and its SVGs are the exception: they are code and generated
  # output, and StatusItemPresentationTests compares MenuBarGlyph's real paths to them.
  - paths:
      - ".agents/qa-gates.yml"
      - "docs/assets/menu-bar-icon/make_menu_bar_icons.py"
      - "docs/assets/menu-bar-icon/idle.svg"
      - "docs/assets/menu-bar-icon/dictating.svg"
      - "docs/assets/menu-bar-icon/meeting.svg"
      - ".agents/test-matrix.yml"
      - ".github/workflows/swift-ci.yml"
      - "scripts/dev/agent-preflight.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
      - "scripts/entrypoints/run-e2e-smoke.sh"
      - "scripts/ops/daily-audio-reliability-check.sh"
      - "scripts/ops/nightly-security-check.py"
      - "scripts/ops/transcripted-qa-bench.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash run-tests.sh"

notes:
  - "If a change matches multiple rules, run the union of checks."
  - "When in doubt, prefer the stricter AGENTS.md rule."
  - "PR-level overlays still apply: meaningful code needs codex-review against the real PR base; broad or release-impacting work needs bash scripts/ops/transcripted-qa-bench.sh --mode full."
  - "Tiny docs-only PRs intentionally stay on preflight/mapped docs checks unless they change release truth, QA gates, appcast/update flow, Homebrew, or public download truth."
  - "Live capture smoke requires local microphone and System Audio Recording permissions; document permission blockers explicitly."
  - "UI changes should include sanitized review visuals under .agent-review/visuals/."
