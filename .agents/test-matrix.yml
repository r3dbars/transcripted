# Path-to-verification map for coding agents.
#
# This file is intentionally simple YAML so humans and agents can read it and
# the dependency-free `scripts/dev/test-matrix-checks.py` selector can execute
# it. `scripts/dev/agent-preflight.sh` delegates here instead of copying rules.

rules:
  - paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
    checks:
      - "bash build.sh --no-open"
      - "bash run-tests.sh"

  - paths:
      - "Sources/Meeting/**"
      - "Sources/TranscriptedCore/**"
      - "Tests/Integration/**"
    checks:
      - "bash build-deps.sh --force"
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "bash run-integration-smoke.sh"

  - paths:
      - "Tests/E2E/**"
      - "run-e2e-smoke.sh"
      - "scripts/entrypoints/run-e2e-smoke.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
    checks:
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash run-e2e-smoke.sh"

  - paths:
      - "Tests/E2E/SlowPastebackSmoke.swift"
      - "Sources/Support/ClipboardRestoringTextPaster.swift"
      - "Sources/Support/ClipboardRestoringTextPaster+Pasteboard.swift"
      - "Sources/Support/ClipboardRestoringTextPaster+SavedClipboard.swift"
      - "Sources/Support/ClipboardPasteOutcome.swift"
      - "Sources/Support/ClipboardPasteConfirmationWait.swift"
      - "Sources/Support/ClipboardPasteTarget.swift"
      - "Sources/Support/FocusedTextPasteConfirmation.swift"
      - "Sources/Support/TranscriptedConstants.swift"
      - "run-slow-pasteback-smoke.sh"
      - "scripts/entrypoints/run-slow-pasteback-smoke.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
    checks:
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash run-slow-pasteback-smoke.sh"

  - paths:
      - "build-deps.sh"
      - "scripts/entrypoints/build-deps.sh"
      - "scripts/entrypoints/lib/deps-staleness.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n build-deps.sh"
      - "bash -n scripts/entrypoints/build-deps.sh"
      - "bash Tests/BuildDependencies/ArchiveInputsTests.sh"
      - "bash build-deps.sh --force"

  - paths:
      - "Tests/BuildDependencies/**"
    checks:
      - "bash -n Tests/BuildDependencies/ArchiveInputsTests.sh"
      - "bash Tests/BuildDependencies/ArchiveInputsTests.sh"
      - "bash -n Tests/BuildDependencies/CLIManifestTests.sh"
      - "bash Tests/BuildDependencies/CLIManifestTests.sh"
      - "bash -n Tests/BuildDependencies/CLIPackagingTests.sh"
      - "bash Tests/BuildDependencies/CLIPackagingTests.sh"
      - "bash -n Tests/BuildDependencies/SparkleAppcastDeltaTests.sh"
      - "bash Tests/BuildDependencies/SparkleAppcastDeltaTests.sh"

  - paths:
      - "scripts/release/generate-sparkle-appcast.sh"
      - "scripts/release/verify-sparkle-release.sh"
      - "scripts/release/provision-release-models.sh"
      - ".github/workflows/release-candidate.yml"
    checks:
      - "bash -n scripts/release/generate-sparkle-appcast.sh"
      - "bash -n scripts/release/verify-sparkle-release.sh"
      - "bash -n scripts/release/provision-release-models.sh"
      - "bash Tests/BuildDependencies/SparkleAppcastDeltaTests.sh"

  - paths:
      - "scripts/entrypoints/lib/bundle-cli.sh"
      - "scripts/entrypoints/build.sh"
      - "scripts/entrypoints/build-beta.sh"
      - "Sources/TranscriptedKeyboard/**"
      - "config/entitlements/**"
      - "scripts/entrypoints/lib/bundle-input-method.sh"
    checks:
      - "bash -n scripts/entrypoints/lib/bundle-cli.sh"
      - "bash Tests/BuildDependencies/CLIPackagingTests.sh"

  - paths:
      - "build.sh"
      - "scripts/entrypoints/build.sh"
      - "scripts/entrypoints/lib/swiftc-app-args.sh"
      - "scripts/entrypoints/lib/deps-staleness.sh"
      - "scripts/entrypoints/lib/voiceprint-model.sh"
      - "Sources/TranscriptedKeyboard/**"
      - "config/entitlements/**"
      - "scripts/entrypoints/lib/bundle-input-method.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash -n build.sh"
      - "bash -n scripts/entrypoints/build.sh"
      - "bash build.sh --no-open"

  - paths:
      - "run-tests.sh"
      - "scripts/entrypoints/run-tests.sh"
      - "scripts/entrypoints/lib/shared-smoke-sources.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 scripts/dev/check-build-source-lists.py"
      - "bash -n run-tests.sh"
      - "bash -n scripts/entrypoints/run-tests.sh"
      - "bash run-tests.sh"

  - paths:
      - "run-integration-smoke.sh"
      - "scripts/entrypoints/run-integration-smoke.sh"
      - "Tests/Integration/**"
      - "scripts/entrypoints/lib/deps-staleness.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n run-integration-smoke.sh"
      - "bash -n scripts/entrypoints/run-integration-smoke.sh"
      - "bash build-deps.sh --force"
      - "bash run-integration-smoke.sh"

  - paths:
      - "run-daily-audio-reliability.sh"
      - "scripts/ops/daily-audio-reliability-check.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n run-daily-audio-reliability.sh"
      - "bash -n scripts/ops/daily-audio-reliability-check.sh"

  - paths:
      - "scripts/vm/**"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/vm/transcripted-vm.sh"
      - "python3 scripts/vm/vnc.py --self-test"
      - "python3 scripts/vm/supervise.py --self-test"
      - "bash scripts/vm/test-transcripted-vm.sh"

  - paths:
      - "scripts/ci/**"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 scripts/ci/pick-ci-runner.py --self-test"
      - "bash scripts/ci/mac-runner.sh self-test"

  - paths:
      - "scripts/ops/health-probe.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/ops/health-probe.sh"

  - paths:
      - "scripts/ops/posthog-product-dashboard-summary.py"
      - "Tests/Fixtures/posthog-product-dashboard-summary.json"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/posthog-product-dashboard-summary.py"
      - "python3 scripts/ops/posthog-product-dashboard-summary.py --self-test"
      - "python3 scripts/ops/posthog-product-dashboard-summary.py --fixture Tests/Fixtures/posthog-product-dashboard-summary.json --json-only"

  - paths:
      - "scripts/ops/auto-merge-gate.py"
      - ".agents/auto-merge-lanes.json"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/auto-merge-gate.py"
      - "python3 scripts/ops/auto-merge-gate.py --self-test"

  - paths:
      - "scripts/dev/onboarding.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/onboarding.sh"

  - paths:
      - "scripts/dev/check-build-source-lists.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/check-build-source-lists.py"
      - "python3 scripts/dev/check-build-source-lists.py"

  - paths:
      - ".agents/agent-contract.json"
      - "scripts/dev/agent-context.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/agent-context.py"
      - "python3 scripts/dev/agent-context.py --self-test"

  # Test-shape ratchet (Tests/README.md, "Test rules"): no new tests that read
  # Sources/ as text or assert on wall-clock time; the grandfathered baseline
  # can only shrink. Also validates Tests/quarantine.txt.
  - paths:
      - "Tests/**"
      - "Tools/*/Tests/**"
      - ".agents/test-shape-baseline.json"
      - "scripts/dev/check-test-shape.py"
    checks:
      - "python3 scripts/dev/check-test-shape.py --self-test"
      - "python3 scripts/dev/check-test-shape.py"

  # Source-pin count ratchet: resolved source-text pins per test file can only
  # shrink (.agents/source-pin-baseline.json). Shrink with
  # `check-source-pins.py --count-baseline --shrink`.
  - paths:
      - "Tests/**/*.swift"
      - ".agents/source-pin-baseline.json"
      - "scripts/dev/check-source-pins.py"
    checks:
      - "python3 scripts/dev/check-source-pins.py --self-test"
      - "python3 scripts/dev/check-source-pins.py --count-baseline"

  # Module-boundary and file-size ratchets: every Sources/ file belongs to a
  # module in .agents/modules.json and names only types its module may depend
  # on; no new Swift file over 800 lines. Both baselines can only shrink.
  - paths:
      - "Sources/**/*.swift"
      - "Tools/*/Sources/**/*.swift"
      - ".agents/modules.json"
      - ".agents/module-boundary-baseline.json"
      - ".agents/file-size-baseline.json"
      - "scripts/dev/check-module-boundaries.py"
      - "scripts/dev/check-duplicate-declarations.py"
      - "scripts/dev/check-file-size.py"
    checks:
      - "python3 scripts/dev/check-module-boundaries.py --self-test"
      - "python3 scripts/dev/check-module-boundaries.py"
      - "python3 scripts/dev/check-file-size.py --self-test"
      - "python3 scripts/dev/check-file-size.py"

  - paths:
      - "Tools/*/Package.swift"
      - ".github/workflows/**"
      - "docs/repo-layout.md"
      - "*.sh"
      - "scripts/entrypoints/build-deps.sh"
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
      - "scripts/dev/check-known-traps.py"
    checks:
      - "python3 scripts/dev/check-known-traps.py --self-test"
      - "python3 scripts/dev/check-known-traps.py"

  - paths:
      - "scripts/dev/explain-missing-sources.py"
      - "scripts/dev/test-parakeet-lifecycle.sh"
    checks:
      - "python3 scripts/dev/explain-missing-sources.py --self-test"
      - "bash -n scripts/dev/test-parakeet-lifecycle.sh"

  # Swift 6 migration ratchet: a typecheck-only pass with strict concurrency
  # (no binary). Concurrency warnings per Sources/ folder may only go down.
  - paths:
      - "Sources/**/*.swift"
      - ".agents/concurrency-baseline.json"
      - "scripts/dev/concurrency-census.sh"
      - "scripts/dev/concurrency-census.py"
    checks:
      - "python3 scripts/dev/concurrency-census.py --self-test"
      - "bash scripts/dev/concurrency-census.sh --check"

  - paths:
      - "scripts/ops/nightly-hardware-smokes.sh"
    checks:
      - "bash -n scripts/ops/nightly-hardware-smokes.sh"
      - "bash scripts/ops/nightly-hardware-smokes.sh --help"

  - paths:
      - "check.sh"
      - "scripts/entrypoints/check.sh"
    checks:
      - "bash -n check.sh"
      - "bash -n scripts/entrypoints/check.sh"
      - "bash check.sh --help"

  - paths:
      - "scripts/dev/agent-check.py"
      - "scripts/dev/agent-preflight.sh"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/agent-check.py"
      - "python3 scripts/dev/agent-check.py --self-test"

  - paths:
      - ".agents/test-matrix.yml"
      - "scripts/dev/agent-preflight.sh"
      - "scripts/dev/test-matrix-checks.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/test-matrix-checks.py"
      - "python3 scripts/dev/test-matrix-checks.py --self-test"

  - paths:
      - "scripts/dev/check-superseded.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/check-superseded.py"
      - "python3 scripts/dev/check-superseded.py --self-test"

  - paths:
      - "scripts/dev/mutation-probe.py"
      - "docs/mutation-testing.md"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/dev/mutation-probe.py"
      - "python3 scripts/dev/mutation-probe.py --self-test"

  - paths:
      - "scripts/dev/bench-all.sh"
      - "scripts/dev/bench-compare.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/bench-all.sh"
      - "python3 -m py_compile scripts/dev/bench-compare.py"
      - "python3 scripts/dev/bench-compare.py --self-test"

  - paths:
      - "scripts/dev/benchmark-home-recent-captures.sh"
      - "Tests/Benchmarks/HomeRecentCaptureBenchmark.swift"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/dev/benchmark-home-recent-captures.sh"
      - "scripts/dev/benchmark-home-recent-captures.sh --max-average-load-ms 750 --max-cancellation-ms 100"

  - paths:
      - "scripts/ops/generate-nightly-digest.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/generate-nightly-digest.py"
      - "python3 scripts/ops/generate-nightly-digest.py --self-test"

  - paths:
      - "scripts/ops/posthog-product-context-pack.py"
      - "Tests/Fixtures/posthog-product-context-pack-fixture.json"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/posthog-product-context-pack.py"
      - "python3 scripts/ops/posthog-product-context-pack.py --self-test"
      - "python3 scripts/ops/posthog-product-context-pack.py --fixture Tests/Fixtures/posthog-product-context-pack-fixture.json --write-dir build/posthog-product-context-sample"

  - paths:
      - "scripts/ops/posthog-dashboard-queries.py"
      - "Tests/Fixtures/posthog-dashboard-query-results.json"
      - "Tests/Fixtures/posthog-observed-event-taxonomy.json"
      - "docs/posthog-dashboard-query-helpers.md"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/posthog-dashboard-queries.py"
      - "python3 scripts/ops/posthog-dashboard-queries.py --self-test"
      - "python3 scripts/ops/posthog-dashboard-queries.py --taxonomy-check --observed-fixture Tests/Fixtures/posthog-observed-event-taxonomy.json --json-only"

  - paths:
      - "scripts/ops/nightly-security-check.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/nightly-security-check.py"
      - "python3 scripts/ops/nightly-security-check.py --strict --automation-toml Tests/Fixtures/nightly-security-automation.toml --github-release-json Tests/Fixtures/release-health-github-release-1.1.70.json --write-report build/nightly-security-report.json"

  - paths:
      - "scripts/ops/release-gate-report.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/release-gate-report.py"
      - "python3 scripts/ops/release-gate-report.py --self-test"

  - paths:
      - "scripts/ops/release-health-card.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/release-health-card.py"
      - "python3 scripts/ops/release-health-card.py --self-test"

  - paths:
      - "scripts/ops/check-crash-free-rate.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/check-crash-free-rate.py"
      - "python3 scripts/ops/check-crash-free-rate.py --self-test"
      - "python3 scripts/ops/release-watch.py --self-test"

  - paths:
      - "scripts/ops/release-watch.py"
      - "scripts/ops/posthog_common.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/release-watch.py"
      - "python3 scripts/ops/release-watch.py --self-test"

  - paths:
      - "scripts/release/post-dmg-release-audit.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/post-dmg-release-audit.py"
      - "python3 scripts/release/post-dmg-release-audit.py --self-test"

  - paths:
      - "scripts/release/bump-release-version.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/bump-release-version.py"
      - "python3 scripts/release/bump-release-version.py --self-test"
      - "python3 scripts/release/bump-release-version.py --version 1.1.49 --dry-run"

  - paths:
      - "scripts/release/mark-appcast-critical.py"
      - "docs/appcast.xml"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/mark-appcast-critical.py"
      - "python3 scripts/release/mark-appcast-critical.py --self-test"

  - paths:
      - "scripts/release/sentry-release-dry-run.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/release/sentry-release-dry-run.py"
      - "python3 scripts/release/sentry-release-dry-run.py --self-test"

  - paths:
      - "scripts/ops/packaged-app-smoke.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/packaged-app-smoke.py"
      - "python3 scripts/ops/packaged-app-smoke.py --self-test"

  - paths:
      - "scripts/ops/privacy-leak-sweep.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/privacy-leak-sweep.py"
      - "python3 scripts/ops/privacy-leak-sweep.py --write-report build/privacy-leak-sweep-report.json"

  - paths:
      - "scripts/ops/performance-budget.rb"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "ruby -c scripts/ops/performance-budget.rb"

  - paths:
      - "scripts/ops/transcripted-qa-bench.sh"
      - "scripts/ops/validate-meeting-corpus.py"
      - "scripts/ops/compare-meeting-corpus.py"
      - "docs/qa-test-bench.md"
    checks:
      - "bash -n scripts/ops/transcripted-qa-bench.sh"
      - "bash scripts/ops/transcripted-qa-bench.sh --mode quick"
      - "swift test --package-path Tools/TranscriptedQA"
      - "python3 -m py_compile scripts/ops/validate-meeting-corpus.py"
      - "python3 -m py_compile scripts/ops/compare-meeting-corpus.py"

  - paths:
      - "scripts/stt-shootout/**"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/stt-shootout/run.sh"
      - "python3 -m py_compile scripts/stt-shootout/shootout.py scripts/stt-shootout/engines/py_engines.py scripts/stt-shootout/hillclimb_bench.py"
      - "python3 scripts/stt-shootout/hillclimb_bench.py --self-test"
      - "python3 scripts/stt-shootout/shootout.py --self-test"

  - paths:
      - "scripts/ops/speaker-naming-simulator.py"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "python3 -m py_compile scripts/ops/speaker-naming-simulator.py"
      - "scripts/ops/speaker-naming-simulator.py"
      - "scripts/ops/speaker-naming-simulator.py --sweep"

  - paths:
      - "scripts/ops/dictation-stop-autoeval.sh"
      - "scripts/ops/dictation-recovery-autoeval.rb"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "bash -n scripts/ops/dictation-stop-autoeval.sh"
      - "ruby -c scripts/ops/dictation-recovery-autoeval.rb"

  - paths:
      - "scripts/ops/dictation-recovery-autoeval.rb"
    checks:
      - "scripts/dev/agent-preflight.sh"
      - "ruby -c scripts/ops/dictation-recovery-autoeval.rb"
      - "ruby scripts/ops/dictation-recovery-autoeval.rb --details"

  - paths:
      - "Tests/TranscriptedCoreTests/AudioTests/LiveCaptureSmokeTests.swift"
      - "run-live-capture-smoke.sh"
      - "scripts/entrypoints/run-live-capture-smoke.sh"
    checks:
      - "bash run-live-capture-smoke.sh --skip-build"

  - paths:
      - "Package.swift"
      - "Sources/TranscriptedCore/**"
      - "Tests/TranscriptedCoreTests/**"
      - "Sources/TranscriptedWriting/**"
      - "Tests/TranscriptedWritingTests/**"
    checks:
      - "bash build-deps.sh --force"
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "bash run-integration-smoke.sh"
      - "swift test"

  - paths:
      - "Sources/Observability/**"
      - "Info.plist"
      - "docs/sparkle-updates.md"
      - "docs/appcast.xml"
    checks:
      - "bash build.sh --no-open"
      - "bash run-tests.sh"
      - "python3 scripts/dev/check-analytics-emitters.py"

  # An event tracked but never added to the PSV is dropped before delivery and its
  # fleet count is permanently zero, with the paired DiagnosticsTrail record still
  # landing locally so nothing looks wrong. AnalyticsEventPolicyTests only checks
  # the doc and the PSV against each other, never against the emitting code.
  - paths:
      - "Resources/analytics-events.psv"
      - "docs/privacy-first-observability.md"
      - "scripts/dev/check-analytics-emitters.py"
    checks:
      - "python3 scripts/dev/check-analytics-emitters.py"
      - "bash run-tests.sh"

  # The analytics taxonomy files are union-merged and must stay normalized, and
  # every allowlisted property must survive the sanitizers' sensitive-fragment
  # drop (an allowlisted key containing e.g. "file" or "name" never arrives).
  - paths:
      - "Resources/analytics-events.psv"
      - "Resources/analytics-reviewed-properties.psv"
      - "docs/privacy-first-observability.md"
      - "scripts/ops/normalize-analytics-taxonomy.py"
    checks:
      - "bash run-tests.sh"
      - "python3 scripts/dev/check-analytics-emitters.py"
      - "python3 scripts/ops/normalize-analytics-taxonomy.py --check"
      - "python3 scripts/dev/check-telemetry-keys.py"

  - paths:
      - "Sources/Observability/PayloadSanitizationCore.swift"
      - "Sources/Observability/SentryPayloadSanitizer.swift"
      - "Sources/Observability/AnalyticsPayloadSanitizer.swift"
      - "Sources/Observability/SentryEventPolicy.swift"
      - "Sources/Observability/AnalyticsEventPolicy.swift"
      - "Sources/Observability/CrashReporter.swift"
      - "scripts/dev/check-telemetry-keys.py"
    checks:
      - "python3 -m py_compile scripts/dev/check-telemetry-keys.py"
      - "python3 scripts/dev/check-telemetry-keys.py --self-test"
      - "python3 scripts/dev/check-telemetry-keys.py"

  # Swift fast tests read these trees as text and assert on literals. This is a
  # Linux-runnable early warning for those pins; bash run-tests.sh stays the proof.
  - paths:
      - "Sources/**"
      - "Tests/**/*.swift"
      - "docs/**"
      - "scripts/**"
      - ".agents/**"
      - ".github/**"
      - "Tools/**"
      - "Casks/**"
      - "Resources/**"
      - "Info.plist"
    checks:
      - "python3 scripts/dev/check-source-pins.py --changed-only"

  - paths:
      - "scripts/dev/check-source-pins.py"
    checks:
      - "python3 -m py_compile scripts/dev/check-source-pins.py"
      - "python3 scripts/dev/check-source-pins.py --self-test"
      - "python3 scripts/dev/check-source-pins.py"

